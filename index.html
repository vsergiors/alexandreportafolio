<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cerrado temporalmente</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c1c1e;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    padding: 20px;
  }

  .wrap {
    display: flex;
    align-items: center;
    gap: 60px;
    max-width: 900px;
  }

  .cone-wrap {
    flex-shrink: 0;
    filter: drop-shadow(0 0 45px rgba(224,123,26,0.55));
    animation: float 3s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-10px); }
  }

  svg { width: 210px; height: 245px; image-rendering: pixelated; shape-rendering: crispEdges; }

  .text-block h1 {
    font-size: 42px;
    font-weight: 700;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #f2e4d8 0%, #e07b1a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .text-block p {
    font-size: 18px;
    font-weight: 400;
    color: #b8b8bc;
    line-height: 1.5;
  }

  @media (max-width: 640px) {
    .wrap { flex-direction: column; text-align: center; gap: 30px; }
    svg { width: 150px; height: 175px; }
    .text-block h1 { font-size: 30px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="cone-wrap">
      <!-- Cono de tráfico estilo Minecraft, sólido y sin huecos -->
      <svg viewBox="0 0 48 56" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <defs>
          <pattern id="noiseR" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect width="1" height="1" fill="rgba(0,0,0,0.05)"/>
          </pattern>
          <pattern id="noiseL" width="2" height="2" patternUnits="userSpaceOnUse">
            <rect width="1" height="1" fill="rgba(0,0,0,0.12)"/>
          </pattern>
        </defs>

        <!-- Punta -->
        <polygon points="24,4 21.8,9 24,9" fill="#b3630f"/>
        <polygon points="24,4 26.2,9 24,9" fill="#f2953a"/>

        <!-- Banda 1: blanco -->
        <polygon points="21.8,9 20.7,14 24,14 24,9" fill="#c9c0b0"/>
        <polygon points="26.2,9 27.3,14 24,14 24,9" fill="#faf6ef"/>

        <!-- Banda 2: naranja -->
        <polygon points="20.7,14 18.4,23 24,23 24,14" fill="#b3630f"/>
        <polygon points="27.3,14 29.6,23 24,23 24,14" fill="#f2953a"/>

        <!-- Banda 3: blanco -->
        <polygon points="18.4,23 17,29 24,29 24,23" fill="#c9c0b0"/>
        <polygon points="29.6,23 31,29 24,29 24,23" fill="#faf6ef"/>

        <!-- Banda 4: naranja, cuerpo principal -->
        <polygon points="17,29 14.5,41 24,41 24,29" fill="#b3630f"/>
        <polygon points="31,29 33.5,41 24,41 24,29" fill="#f2953a"/>

        <!-- textura -->
        <polygon points="24,4 21.8,9 20.7,14 18.4,23 17,29 14.5,41 24,41 24,4" fill="url(#noiseL)"/>
        <polygon points="24,4 26.2,9 27.3,14 29.6,23 31,29 33.5,41 24,41 24,4" fill="url(#noiseR)"/>

        <!-- Faldón antes de la base -->
        <polygon points="14.5,41 11.5,44 24,44 24,41" fill="#8a4a0c"/>
        <polygon points="33.5,41 36.5,44 24,44 24,41" fill="#b25f10"/>

        <!-- Base: tapa superior -->
        <polygon points="11.5,44 36.5,44 24,47" fill="#d97615"/>

        <!-- Base: paredes -->
        <polygon points="11.5,44 24,47 24,51 11.5,48" fill="#7a4009"/>
        <polygon points="36.5,44 24,47 24,51 36.5,48" fill="#a2560e"/>
      </svg>
    </div>

    <div class="text-block">
      <h1>Cerrado temporalmente</h1>
      <p>El sitio está actualmente en mantenimiento.<br>Vuelve a pasarte más tarde.</p>
    </div>
  </div>

</body>
</html>
